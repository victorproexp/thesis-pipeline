lor": "white"}, "id": 3, "label": "T3\ninnovation \u00b7 developer \u00b7 data \u00b7 organization \u00b7 research", "shape": "dot", "size": 21.0, "title": "Topic 3 (5 docs)\n  innovation (0.255)\n  developer (0.254)\n  data (0.247)\n  organization (0.235)\n  research (0.227)\n  googlers (0.225)\n  future (0.224)\n  internet (0.212)\n\nNo values terms in top keywords"}, {"color": "#C4A7E7", "font": {"color": "white"}, "id": 4, "label": "T4\ncomputing \u00b7 computing research \u00b7 mentorship \u00b7 mentor \u00b7 researcher", "shape": "dot", "size": 18.6, "title": "Topic 4 (3 docs)\n  computing (0.342)\n  computing research (0.337)\n  mentorship (0.258)\n  mentor (0.250)\n  researcher (0.249)\n  research community (0.242)\n  support (0.224)\n  virtual reality (0.219)\n\nNo values terms in top keywords"}]);

                  var options = {"physics": {"enabled": true, "solver": "forceAtlas2Based", "forceAtlas2Based": {"gravitationalConstant": -250, "centralGravity": 0.008, "springLength": 350, "springConstant": 0.04, "damping": 0.5, "avoidOverlap": 0.8}, "stabilization": {"iterations": 400, "fit": true}}, "edges": {"smooth": {"type": "continuous"}, "scaling": {"min": 1, "max": 18}}, "interaction": {"hover": true, "tooltipDelay": 100, "zoomView": true, "dragNodes": true, "dragView": true}};

    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function() {
        var checkNetwork = setInterval(function() {
          if (typeof network !== 'undefined') {
            clearInterval(checkNetwork);
            network.on("stabilized", function() {
              network.setOptions({physics: {enabled: false}});
            });
