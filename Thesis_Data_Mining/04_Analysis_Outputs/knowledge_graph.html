                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python

ont": {"color": "white"}, "id": 3, "label": "Gdpr and Security\ngdpr \u00b7 security \u00b7 governance \u00b7 cloud \u00b7 infrastructure\n\u27e8security, governance, infrastructure\u27e9", "shape": "triangle", "size": 21.0, "title": "Topic 3 (5 docs)\n  gdpr (0.559)\n  security (0.492)\n  governance (0.383)\n  cloud (0.363)\n  infrastructure (0.357)\n  secure (0.356)\n  compliance (0.346)\n  threat actor (0.345)\n\nValues terms: security, governance, infrastructure"}, {"color": "#C4A7E7", "font": {"color": "white"}, "id": 4, "label": "Economic and Billion\nbillion economic \u00b7 economic activity \u00b7 technology \u00b7 business \u00b7 data", "shape": "triangle", "size": 19.8, "title": "Topic 4 (4 docs)\n  billion economic (0.436)\n  economic activity (0.395)\n  economic (0.370)\n  technology (0.336)\n  business (0.335)\n  data (0.331)\n  company (0.309)\n  business used (0.289)\n\nNo values terms in top keywords"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"enabled": true, "solver": "forceAtlas2Based", "forceAtlas2Based": {"gravitationalConstant": -250, "centralGravity": 0.008, "springLength": 350, "springConstant": 0.04, "damping": 0.5, "avoidOverlap": 0.8}, "stabilization": {"iterations": 400, "fit": true}}, "edges": {"smooth": {"type": "continuous"}, "scaling": {"min": 1, "max": 18}}, "interaction": {"hover": true, "tooltipDelay": 100, "zoomView": true, "dragNodes": true, "dragView": true}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();

    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function() {
        var checkNetwork = setInterval(function() {
          if (typeof network !== 'undefined') {
            clearInterval(checkNetwork);
            network.on("stabilized", function() {
              network.setOptions({physics: {enabled: false}});
            });
          }
        }, 100);
      });
